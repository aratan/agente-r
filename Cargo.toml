[package]
name = "local-agent"
version = "0.1.0"
edition = "2024"
description = "Agente LLM local (Ollama / llama.cpp) con shell, ficheros y navegador"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }
tungstenite = "0.28"
