name: CI

on: push

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Edición 2024: hace falta 1.85 o superior; se usa stable, no nightly.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Caché de cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Tests
        run: cargo test --locked

      # Sin -D warnings: hay avisos heredados en web.rs, media.rs, browser.rs y
      # main.rs. Clippy falla solo si hay errores; cuando se limpien los avisos,
      # añadir `-- -D warnings`.
      - name: Clippy
        run: cargo clippy --locked --all-targets
