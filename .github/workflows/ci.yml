name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Edición 2024: hace falta 1.85 o superior; se usa stable, no nightly.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Tests
        run: cargo test --locked

      # Los avisos cuentan como fallo: si el CI se pone rojo, se arregla el
      # aviso o se justifica un `#[allow(...)]` con motivo.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
